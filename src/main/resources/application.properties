spring.application.name=BillGates

# Import .env file
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# data.sql ?? ?? (item ??? ???)
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
#spring.sql.init.data-locations=classpath:data.sql

# Hibernate -> jpa ?? ??
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG

#thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

#jpa table -> jpa ?? ??
#jpa? db ??? ?? ??
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring batch
spring.batch.jdbc.initialize-schema=never
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# ???? ?? ??? Entity? ?? ??? ?? ???? ??
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#server-tomcat
server.tomcat.mbeanregistry.enabled=true

spring.kafka.bootstrap-servers=localhost:9092


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=my-group

spring.kafka.consumer.properties.spring.json.trusted.packages=*

# encrypt util
encryption.secret=${ENCRYPTION_SECRET}
encryption.iv=${ENCRYPTION_IV}


#kafka
spring.kafka.consumer.properties.spring.json.value.default.type=springboot.billgates.kafka.dto.NotificationEvent

#DB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

spring.application.name=BillGates

# -------------------------------------------------
# Import .env file
# -------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# -------------------------------------------------
# MySQL
# -------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -------------------------------------------------
# SQL init
# -------------------------------------------------
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

# -------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA Batch Insert (🔥 성능 핵심)
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=false
spring.jpa.properties.hibernate.generate_statistics=false

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -------------------------------------------------
# Spring Batch
# -------------------------------------------------
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# -------------------------------------------------
# Tomcat
# -------------------------------------------------
server.tomcat.mbeanregistry.enabled=true

# -------------------------------------------------
# Kafka - Common
# -------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

# -------------------------------------------------
# Kafka Producer
# -------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer Performance
spring.kafka.producer.properties.batch.size=16384
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.properties.buffer.memory=33554432

# Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Producer Timeout
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000

# -------------------------------------------------
# Kafka Consumer
# -------------------------------------------------
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=springboot.billgates.kafka.dto.NotificationEvent

# Consumer Batch Processing - ??? ??? ? ?? ? ?? ? ??
spring.kafka.consumer.max-poll-records=500
# ?? ?? ???
spring.kafka.consumer.properties.max.poll.interval.ms=600000

# Consumer Concurrency (DB 기준으로 조절)
spring.kafka.listener.concurrency=3

# -------------------------------------------------
# Flyway
# -------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# -------------------------------------------------
# Encryption
# -------------------------------------------------
encryption.secret=${ENCRYPTION_SECRET}
encryption.iv=${ENCRYPTION_IV}

# -------------------------------------------------
# Thymeleaf
# -------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -------------------------------------------------
# Mail (Mailpit)
# -------------------------------------------------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.default-encoding=UTF-8
